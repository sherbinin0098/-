name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-src.zip'
      - '.github/workflows/apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VCODE: ${{ github.run_number }}
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE != '' }}
      SIDELOAD_PASSWORD: ${{ secrets.SIDELOAD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: unzip -q -o android-src.zip -d android
      - name: Sideload key from secrets
        env:
          SIDELOAD_KEYSTORE: ${{ secrets.SIDELOAD_KEYSTORE }}
        run: |
          if [ -z "$SIDELOAD_KEYSTORE" ] || [ -z "$SIDELOAD_PASSWORD" ]; then
            echo "::error::Missing secrets SIDELOAD_KEYSTORE / SIDELOAD_PASSWORD (Settings - Secrets and variables - Actions)"
            exit 1
          fi
          echo "$SIDELOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/sideload.jks"
          echo "SIDELOAD_KEYSTORE_FILE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"
      - run: gradle -p android assembleRelease --no-daemon -PvCode=$((100 + VCODE)) -PvName=1.7.$VCODE
      - run: cp android/app/build/outputs/apk/release/app-release.apk Proverka-avto.apk
      - name: Check APK is signed with the sideload key
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          EXPECTED=$(keytool -exportcert -alias sideload -keystore "$SIDELOAD_KEYSTORE_FILE" -storepass:env SIDELOAD_PASSWORD | sha256sum | cut -d' ' -f1)
          ACTUAL=$("$APKSIGNER" verify --print-certs Proverka-avto.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "expected: $EXPECTED"
          echo "in APK:   $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ]
      - name: AAB for Google Play
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
          UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" gradle -p android bundleRelease --no-daemon -Pupload -PvCode=$((100 + VCODE)) -PvName=1.7.$VCODE
          cp android/app/build/outputs/bundle/release/app-release.aab Proverka-avto-google-play.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Remove keys from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/sideload.jks" "$RUNNER_TEMP/upload.jks"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Проверка авто, сборка ${{ github.run_number }}
          files: |
            Proverka-avto.apk
            Proverka-avto-google-play.aab
